name: Quality checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evora
          POSTGRES_PASSWORD: evora
          POSTGRES_DB: evora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evora -d evora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://evora:evora@localhost:5432/evora_test
      DRIZZLE_KIT_DATABASE_URL: postgres://evora:evora@localhost:5432/evora_test
      TEST_DATABASE_URL: postgres://evora:evora@localhost:5432/evora_test
      SESSION_SECRET: ci-only-session-secret-not-used-in-production
      AUTH_SECRET: ci-only-auth-secret-that-is-long-enough-for-test-runs

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # This is a clean disposable PostgreSQL service. The integration suite
      # verifies both the six storefront tables and additive auth tables.
      - name: Create clean test schema
        run: npm run db:push -- --force

      - name: Test against PostgreSQL
        shell: bash
        run: |
          set +e
          npm test > /tmp/evora-tests.log 2>&1
          result=$?
          cat /tmp/evora-tests.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import os

          lines = Path("/tmp/evora-tests.log").read_text().splitlines()
          starts = [index for index, line in enumerate(lines) if line.startswith("not ok ")]
          details = []
          for start in starts:
              end = next((index for index in range(start + 1, len(lines))
                          if lines[index].startswith(("# Subtest:", "ok ", "not ok "))), len(lines))
              details.append("\n".join(lines[start:end]).strip())
          message = "\n\n".join(details) or "\n".join(lines[-60:])
          summary = "### PostgreSQL test failure details\n\n```text\n" + message + "\n```\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=PostgreSQL test failure::{escaped}")
          PY
          fi
          exit "$result"

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev
